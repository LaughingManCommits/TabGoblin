<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Tracker: Edit profile</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 8px; }
    fieldset { margin: 12px 0; }
    #bio { border: 1px solid #c8d0d8; border-radius: 4px; min-height: 60px; padding: 8px; }
    #note-error { color: #b42318; }
  </style>
</head>
<body>
  <nav><a href="/">Back to issues</a></nav>
  <h1>Edit profile</h1>

  <!-- A classic form: validated by the browser, posted to the server, answered with a new page. -->
  <form id="profile" method="post" action="/echo">
    <label for="name">Display name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    <label for="born">Birth date</label>
    <input id="born" name="born" type="date">
    <fieldset>
      <legend>Plan</legend>
      <label><input type="radio" name="plan" value="free" checked> Free</label>
      <label><input type="radio" name="plan" value="pro"> Pro</label>
    </fieldset>
    <label><input type="checkbox" name="news" value="yes"> Newsletter</label>
    <label id="bio-label">Bio</label>
    <div id="bio" contenteditable="true" role="textbox" aria-labelledby="bio-label"></div>
    <input type="hidden" name="bio" id="bio-hidden">
    <button type="submit">Save profile</button>
  </form>

  <!-- A script-driven form: validated in the page, which reports problems through an alert. -->
  <h2>Quick note</h2>
  <form id="note-form">
    <label for="note">Note</label>
    <input id="note" name="note" autocomplete="off">
    <button type="submit">Add note</button>
  </form>
  <p id="note-error" role="alert"></p>
  <ul id="notes"></ul>

  <script>
    const $ = (id) => document.getElementById(id);
    $('profile').addEventListener('submit', () => { $('bio-hidden').value = $('bio').textContent; });
    let typed = 0;
    $('note').addEventListener('keydown', () => { typed++; $('note').dataset.keys = String(typed); });
    $('note-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('note').value.trim();
      if (text.length < 3) {
        $('note-error').textContent = 'Note is too short';
        $('note').setAttribute('aria-invalid', 'true');
        return;
      }
      $('note-error').textContent = '';
      $('note').removeAttribute('aria-invalid');
      const li = document.createElement('li');
      li.textContent = text;
      $('notes').append(li);
      $('note').value = '';
    });
  </script>
</body>
</html>
