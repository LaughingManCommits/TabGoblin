<text class="sub" fill="#475569" x="54" y="440" font-size="11" font-weight="600" letter-spacing="0.6">CHROME PROFILE</text>
<rect class="tint" fill-opacity="0.07" x="60" y="452" width="360" height="88" rx="8" fill="#16A34A" stroke="#16A34A" stroke-width="1.25"/>
<text class="name" fill="#0F172A" font-weight="600" x="240" y="476.6666666666667" text-anchor="middle" font-size="14">TabGoblin extension</text>
<text class="sub" fill="#475569" x="240" y="492.6666666666667" text-anchor="middle" font-size="12">checks: session · origin · access level</text>
