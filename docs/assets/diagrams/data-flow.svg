<text class="sub" fill="#475569" x="510" y="432.6666666666667" text-anchor="middle" font-size="12">token · keys</text>
<text class="sub" fill="#475569" x="510" y="448.6666666666667" text-anchor="middle" font-size="12">settings · audit</text>
