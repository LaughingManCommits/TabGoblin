<text class="sub" fill="#475569" x="250" y="392" text-anchor="start" font-size="11">WebSocket on 127.0.0.1</text>
<text class="sub" fill="#475569" x="250" y="406" text-anchor="start" font-size="11">commands and results</text>
<rect class="tint" fill-opacity="0.07" x="60" y="578" width="360" height="48" rx="8" fill="#16A34A" stroke="#16A34A" stroke-width="1.25"/>
