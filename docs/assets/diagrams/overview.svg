<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 742" width="760" height="742" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">TabGoblin at a glance</title>
<desc id="d">An AI coding agent reaches TabGoblin through the CLI or through MCP, two interfaces side by side. Both lead to the one TabGoblin server, which proves who is asking, validates every request (enforced) and applies the user's settings (configurable). The server sends the command to the TabGoblin extension, which checks the session, the origin and the access level again (enforced) and asks the user before a submission (configurable). The command reaches only the tabs the user authorized; every other tab is denied, and no path leads there.</desc>
<style>
svg { --ground: #FFFFFF; --edge: #D0D7DE; --text: #0F172A; --soft: #475569; --line: #64748B; --tint: 0.07; --red-text: #B91C1C; --green-text: #15803D; --amber-text: #B45309; }
@media (prefers-color-scheme: dark) {
  svg { --ground: #0D1117; --edge: #30363D; --text: #E2E8F0; --soft: #94A3B8; --line: #94A3B8; --tint: 0.14; --red-text: #F87171; --green-text: #4ADE80; --amber-text: #FBBF24; }
}
.ground { fill: var(--ground); stroke: var(--edge); }
.name { fill: var(--text); font-weight: 600; }
.sub { fill: var(--soft); }
.red-text { fill: var(--red-text); }
.green-text { fill: var(--green-text); }
.amber-text { fill: var(--amber-text); }
.tint { fill-opacity: var(--tint); }
.half { fill-opacity: calc(var(--tint) / 2); }
.wire { fill: none; stroke: var(--line); stroke-width: 1.25; }
.wire.red { stroke: #DC2626; }
.wire.green { stroke: #16A34A; }
.wire.amber { stroke: #D97706; }
.tip { fill: var(--line); }
.rule { stroke: var(--line); stroke-opacity: 0.35; }
</style>
