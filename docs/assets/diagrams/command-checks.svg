<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1066" width="800" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Where a command is checked</title>
<desc id="d">A command from the CLI or from MCP passes two checks in the TabGoblin server and four in the TabGoblin extension before one fixed operation runs in the authorized tab. A check that fails refuses the command with an error code. Whether the user is asked about a submission is configurable; the other checks are enforced. Taking credential-like text out of the result is best effort.</desc>
