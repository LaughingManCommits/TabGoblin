<text x="310" y="730.6666666666666" text-anchor="middle" font-size="12" fill="#94A3B8">sessions · rules · flows</text>
<polyline points="310,564 310,690" fill="none" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#head)"/>
<text x="320" y="604" text-anchor="start" font-size="11" fill="#94A3B8">WebSocket on 127.0.0.1</text>
<text x="320" y="618" text-anchor="start" font-size="11" fill="#94A3B8">paired · protocol 3</text>
<rect x="170" y="790" width="280" height="56" rx="8" fill="#16A34A" fill-opacity="0.14" stroke="#16A34A" stroke-width="1.25"/>
<text x="310" y="814.6666666666666" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">Content script</text>
<text x="310" y="830.6666666666666" text-anchor="middle" font-size="12" fill="#94A3B8">fixed page operations</text>
<polyline points="310,746 310,790" fill="none" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#head)"/>
<text x="320" y="772" text-anchor="start" font-size="11" fill="#94A3B8">one operation</text>
<rect x="560" y="690" width="146" height="56" rx="8" fill="#16A34A" fill-opacity="0.14" stroke="#16A34A" stroke-width="1.25"/>
<text x="633" y="714.6666666666666" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">Popup</text>
