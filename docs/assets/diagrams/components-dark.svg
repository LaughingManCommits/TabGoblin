<text x="676" y="420.6666666666667" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">Home folder</text>
<text x="676" y="436.6666666666667" text-anchor="middle" font-size="12" fill="#94A3B8">token · agent keys</text>
<text x="676" y="452.6666666666667" text-anchor="middle" font-size="12" fill="#94A3B8">settings · audit</text>
<polyline points="450,432 606,432" fill="none" stroke="#94A3B8" stroke-width="1.25" stroke-dasharray="4 4"/>
<rect x="40" y="632" width="706" height="342" rx="12" fill="#64748B" fill-opacity="0" stroke="#64748B" stroke-width="1" stroke-dasharray="6 5"/>
