<text x="180" y="164.66666666666666" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">CLI</text>
<text x="180" y="180.66666666666666" text-anchor="middle" font-size="12" fill="#94A3B8">one process per command</text>
<rect x="330" y="140" width="220" height="56" rx="8" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-width="1.25"/>
<text x="440" y="164.66666666666666" text-anchor="middle" font-size="14" font-weight="600" fill="#E2E8F0">MCP link</text>
<text x="440" y="180.66666666666666" text-anchor="middle" font-size="12" fill="#94A3B8">one process per agent</text>
