<polyline points="350,68 350,88 440,88 440,140" fill="none" stroke="#94A3B8" stroke-width="1.25" marker-end="url(#head)"/>
<text x="172" y="102" text-anchor="end" font-size="11" fill="#94A3B8">runs a command</text>
<text x="448" y="102" text-anchor="start" font-size="11" fill="#94A3B8">MCP over stdio</text>
