<rect class="tint" fill-opacity="0.07" x="230" y="24" width="300" height="52" rx="8" fill="#64748B" stroke="#64748B" stroke-width="1.25"/>
<text class="name" fill="#0F172A" font-weight="600" x="380" y="46.666666666666664" text-anchor="middle" font-size="14">AI coding agent</text>
<text class="sub" fill="#475569" x="380" y="62.666666666666664" text-anchor="middle" font-size="12">through the CLI or MCP</text>
<rect class="tint" fill-opacity="0.07" x="80" y="110" width="600" height="92" rx="8" fill="#16A34A" stroke="#16A34A" stroke-width="1.25"/>
<text class="name" fill="#0F172A" font-weight="600" x="380" y="140" text-anchor="middle" font-size="18">TabGoblin checks every command</text>
<text class="sub" fill="#475569" x="380" y="162" text-anchor="middle" font-size="14">the agent is who it says · the tab is authorized for it</text>
<text class="sub" fill="#475569" x="380" y="184" text-anchor="middle" font-size="14">the page is on its website · the level covers it · the policy allows it</text>
<polyline class="wire" fill="none" stroke="#64748B" stroke-width="1.25" points="380,76 380,110" marker-end="url(#head)"/>
<rect class="tint" fill-opacity="0.07" x="30" y="262" width="220" height="112" rx="8" fill="#16A34A" stroke="#16A34A" stroke-width="1.25"/>
<text class="name" fill="#0F172A" font-weight="600" x="140" y="298.6666666666667" text-anchor="middle" font-size="14">Authorized tabs</text>
