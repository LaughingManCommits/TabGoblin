<text class="name" fill="#0F172A" font-weight="600" x="380" y="298.6666666666667" text-anchor="middle" font-size="14">Submissions</text>
<text class="sub" fill="#475569" x="380" y="314.6666666666667" text-anchor="middle" font-size="12">declared by the agent</text>
<text class="sub" fill="#475569" x="380" y="330.6666666666667" text-anchor="middle" font-size="12">shown to you first by default</text>
<text class="sub" fill="#475569" x="380" y="346.6666666666667" text-anchor="middle" font-size="12">you allow or deny</text>
<rect class="tint" fill-opacity="0.07" x="510" y="262" width="220" height="112" rx="8" fill="#DC2626" stroke="#DC2626" stroke-width="1.25" stroke-dasharray="5 4"/>
<text class="name" fill="#0F172A" font-weight="600" x="620" y="290.6666666666667" text-anchor="middle" font-size="14">Out of reach</text>
<text class="sub" fill="#475569" x="620" y="306.6666666666667" text-anchor="middle" font-size="12">other tabs and websites</text>
<text class="sub" fill="#475569" x="620" y="322.6666666666667" text-anchor="middle" font-size="12">cookies, headers, site storage</text>
<text class="sub" fill="#475569" x="620" y="338.6666666666667" text-anchor="middle" font-size="12">password fields</text>
<text class="sub" fill="#475569" x="620" y="354.6666666666667" text-anchor="middle" font-size="12">scripts, debugger, requests</text>
<polyline class="wire" fill="none" stroke="#64748B" stroke-width="1.25" points="380,202 380,232"/>
<polyline class="wire green" fill="none" stroke="#16A34A" stroke-width="1.25" points="380,232 140,232 140,262" marker-end="url(#head-green)"/>
<polyline class="wire amber" fill="none" stroke="#D97706" stroke-width="1.25" points="380,232 380,262" marker-end="url(#head-amber)"/>
<polyline class="wire red" fill="none" stroke="#DC2626" stroke-width="1.25" points="380,232 620,232 620,262" stroke-dasharray="4 4"/>
<text class="green-text" fill="#15803D" x="140" y="396" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.6">ENFORCED</text>
<text class="sub" fill="#475569" x="380" y="396" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.6">CONFIGURABLE</text>
<text class="amber-text" fill="#B45309" x="380" y="412" text-anchor="middle" font-size="11">allowed: it runs in the tab</text>
<text class="amber-text" fill="#B45309" x="380" y="426" text-anchor="middle" font-size="11">denied or unanswered: not sent</text>
<text class="green-text" fill="#15803D" x="620" y="396" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.6">ENFORCED</text>
<text class="red-text" fill="#B91C1C" x="620" y="412" text-anchor="middle" font-size="11">no tool, no permission for it</text>
<line class="rule" stroke="#64748B" stroke-opacity="0.35" x1="24" y1="446" x2="736" y2="446" stroke-width="1"/>
