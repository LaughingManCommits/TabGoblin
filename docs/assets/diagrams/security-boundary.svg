<text class="sub" fill="#475569" x="140" y="330.6666666666667" text-anchor="middle" font-size="12">on their exact websites</text>
<text class="sub" fill="#475569" x="140" y="346.6666666666667" text-anchor="middle" font-size="12">Read, Explore or Read / Write</text>
