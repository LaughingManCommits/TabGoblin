<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How a change keeps the documentation true</title>
<desc id="d">AGENTS.md is the entry every agent reads: it holds the rule that documentation is part of a change, and the definition of done. The rules themselves are owned by one section of docs/development.md: what a change owes the pages, the impact review by kind of change, the contract for diagrams and pictures, the grades of a security claim, and the checks. They apply to three kinds of artefact: the pages, the pictures (the SVG diagrams drawn by one script, the Mermaid diagrams in the pages, the screenshots made by their scripts) and the six agent skills. Before a change is done, the impact review and the checks run: the contract tests, the link, personal and drift checks, the diagram check. A change is complete when it ends with the documentation review summary.</desc>
