name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs these suites first, before it makes anything, on the tree with the version
  # it is to release: each job that builds or tests sets it first.
  workflow_call:
    inputs:
      version:
        description: The version the release sets in the files before the suites run.
        type: string
        default: ''

permissions:
  contents: read

# A newer run of the same workflow for the same branch takes the place of an older one. The
# workflow is in the group's name because the release calls these jobs: called, they run under
# the release's name, and so beside a CI run for the same branch instead of in its place.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Java server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: The release's version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node release/version.mjs "$VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, test, and check the built jar against the protocol
        run: mvn -B -f java-server/pom.xml verify

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: The release's version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node release/version.mjs "$VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - name: Install
        working-directory: chrome-extension
        run: npm ci
      - name: Type-check, test and build
        working-directory: chrome-extension
        run: npm run check

  # The documentation's checks: no home directory, no mail address outside the example domains
  # and no link to an agent's session in the files; no retired name, the numbers both parts
  # carry the same, every code file and variable a page names there; every link resolves; the
  # SVG diagrams as their script draws them; every Mermaid block parses. The checks' own tests
  # run first. Mermaid is installed outside the tree: its dependencies carry advisories.
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the checks
        run: |
          node --test docs/agents/check-personal.test.mjs
          node --test docs/agents/check-drift.test.mjs
      - name: Nothing personal in the files
        run: node docs/agents/check-personal.mjs
      - name: No drift between the parts and the pages
        run: node docs/agents/check-drift.mjs
      - name: The documentation's links
        run: node docs/agents/check-links.mjs
      - name: The SVG diagrams are what their script draws
        run: |
          node docs/assets/diagrams/build.mjs
          git diff --exit-code -- docs/assets/diagrams
      - name: The browser driver, for the Mermaid check
        working-directory: e2e
        run: npm ci
      - name: Mermaid, outside the tree
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/mermaid" mermaid@11.4.1
      - name: The Mermaid diagrams parse
        env:
          MERMAID: ${{ runner.temp }}/mermaid/node_modules/mermaid/dist/mermaid.min.js
        run: node docs/agents/check-diagrams.mjs

  # The files that carry the version name the same one. The script's own tests run first.
  version:
    name: One version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The release's version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node release/version.mjs "$VERSION"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the script
        run: node --test release/version.test.mjs
      - name: Check the files
        run: node release/version.mjs

  # Known vulnerabilities in what the parts are built from and with. The npm packages are asked
  # of the registry; a pull request is also held against GitHub's advisories, which covers the
  # server's Maven libraries. Neither needs a service of our own.
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: The extension's packages
        working-directory: chrome-extension
        run: npm audit --audit-level=high
      - name: The test runner's packages
        working-directory: e2e
        run: npm audit --audit-level=high
      # The editors under test are other people's libraries at fixed versions, loaded in a test
      # page and never shipped. Some of them carry advisories: they are listed, and do not fail the job.
      - name: The editor lab's packages, listed only
        working-directory: e2e/editors
        run: npm audit --audit-level=high || true
      - name: What a pull request changes, against GitHub's advisories
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # The whole chain in a real Chrome: two servers, the unmodified extension, three demo sites.
  # Runs on Windows because that is where the suite is developed and known to pass.
  e2e:
    name: End to end
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The release's version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node release/version.mjs "$VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            e2e/package-lock.json
      - name: Build the server
        run: mvn -B -f java-server/pom.xml package -DskipTests
      - name: Build the extension
        working-directory: chrome-extension
        run: |
          npm ci
          npm run build
      - name: Install the test runner
        working-directory: e2e
        run: npm ci
      - name: Run the end-to-end suite
        working-directory: e2e
        run: npm test

  # Text entry into real rich-text and code editors, checked against each editor's own model.
  editors:
    name: Editors
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The release's version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node release/version.mjs "$VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            e2e/package-lock.json
            e2e/editors/package-lock.json
      - name: Build the server
        run: mvn -B -f java-server/pom.xml package -DskipTests
      - name: Build the extension
        working-directory: chrome-extension
        run: |
          npm ci
          npm run build
      - name: Install the test runner and the editors
        run: |
          npm ci --prefix e2e
          npm ci --prefix e2e/editors
      - name: Run the editor lab
        working-directory: e2e/editors
        run: npm test
