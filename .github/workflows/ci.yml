name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs these suites first, before it makes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Java server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test, and check the built jar against the protocol
        run: mvn -B -f java-server/pom.xml verify

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - name: Install
        working-directory: chrome-extension
        run: npm ci
      - name: Type-check, test and build
        working-directory: chrome-extension
        run: npm run check

  # No home directory, no mail address outside the example domains and no link to an agent's
  # session in the files. The check's own tests run first.
  personal:
    name: Nothing personal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the check
        run: node --test docs/agents/check-personal.test.mjs
      - name: Check the files
        run: node docs/agents/check-personal.mjs

  # The whole chain in a real Chrome: two servers, the unmodified extension, three demo sites.
  # Runs on Windows because that is where the suite is developed and known to pass.
  e2e:
    name: End to end
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            e2e/package-lock.json
      - name: Build the server
        run: mvn -B -f java-server/pom.xml package -DskipTests
      - name: Build the extension
        working-directory: chrome-extension
        run: |
          npm ci
          npm run build
      - name: Install the test runner
        working-directory: e2e
        run: npm ci
      - name: Run the end-to-end suite
        working-directory: e2e
        run: npm test

  # Text entry into real rich-text and code editors, checked against each editor's own model.
  editors:
    name: Editors
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            chrome-extension/package-lock.json
            e2e/package-lock.json
            e2e/editors/package-lock.json
      - name: Build the server
        run: mvn -B -f java-server/pom.xml package -DskipTests
      - name: Build the extension
        working-directory: chrome-extension
        run: |
          npm ci
          npm run build
      - name: Install the test runner and the editors
        run: |
          npm ci --prefix e2e
          npm ci --prefix e2e/editors
      - name: Run the editor lab
        working-directory: e2e/editors
        run: npm test
